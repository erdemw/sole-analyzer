<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>SOLE Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      text-align: center;
      padding: 35px 20px 20px;
    }

    h1 {
      margin: 0;
      color: #f2c14e;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #aab6c8;
      margin-top: 8px;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #101d31;
      border: 1px solid #263955;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .button {
      display: block;
      width: 100%;
      background: #f2c14e;
      color: #111;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
    }

    input[type=file] {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      margin-top: 18px;
      border-radius: 12px;
      background: #050a11;
    }

    #status {
      color: #aab6c8;
      margin-top: 15px;
      line-height: 1.4;
    }

    .success {
      color: #65d58a !important;
      font-weight: 600;
    }
  </style>
</head>

<body>

<header>
  <h1>SOLE ANALYZER</h1>
  <div class="subtitle">Backgammon Analysis</div>
</header>

<main>

  <div class="card">

    <h2>1 · Screenshot</h2>

    <label class="button" for="screenshot">
      Screenshot auswählen
    </label>

    <input
      id="screenshot"
      type="file"
      accept="image/*"
    >

    <div id="status">
      Noch kein Screenshot ausgewählt.
    </div>

    <img id="preview" alt="Backgammon Screenshot">

  </div>

  <div class="card">

    <h2>2 · Position</h2>

    <div id="positionStatus">
      Warte auf Screenshot …
    </div>

  </div>

  <div class="card">

    <h2>3 · Analyse</h2>

    <div>
      Die Engine wird nach erfolgreichem Screenshot-Test integriert.
    </div>

  </div>

</main>

<script>

const input = document.getElementById("screenshot");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const positionStatus = document.getElementById("positionStatus");

input.addEventListener("change", function () {

  const file = this.files && this.files[0];

  if (!file) {
    status.textContent = "Keine Datei ausgewählt.";
    return;
  }

  if (!file.type.startsWith("image/")) {
    status.textContent = "Bitte eine Bilddatei auswählen.";
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {

    preview.src = event.target.result;
    preview.style.display = "block";

    status.textContent =
      "✓ Screenshot erfolgreich geladen";

    status.className = "success";

    positionStatus.textContent =
      "Screenshot vorhanden – bereit für Positionserkennung.";

  };

  reader.onerror = function () {

    status.textContent =
      "Fehler: Screenshot konnte nicht geladen werden.";

  };

  reader.readAsDataURL(file);

});

</script>

</body>
</html>
